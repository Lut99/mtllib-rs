[package]
name = "mtllib"
version = "0.1.0"
edition = "2024"
license = "GPLv3"
repository = "https://github.com/Lut99/mtllib-rs"
description = "Parser for Wavefront's `.mtllib` format."


[dependencies]
thiserror = { version = "2.0.0", optional = true }

obj-tokenizer = { git = "https://github.com/Lut99/obj-tokenizer-rs", rev = "f4016e585a52a3cc489b6580f05f2436398d690a", optional = true }


[features]
default = ["io"]

io = ["dep:thiserror", "dep:obj-tokenizer"]
