[package]
name = "mtllib"
version = "0.1.0"
edition = "2024"
license = "GPLv3"
repository = "https://github.com/Lut99/mtllib-rs"
description = "Parser for Wavefront's `.mtllib` format."


[dependencies]
thiserror = { version = "2.0.0", optional = true }

obj-tokenizer = { git = "https://github.com/Lut99/obj-tokenizer-rs", rev = "b717ff1d39c010ad79d498b765f16a3f9a11571c", optional = true }


[features]
default = ["io"]

io = ["dep:thiserror", "dep:obj-tokenizer"]
